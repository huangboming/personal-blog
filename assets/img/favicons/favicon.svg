<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- 白色贴纸外描边（确保在深色浏览器标签栏下轮廓绝对分明） -->
  <path d="M 14 42 L 14 14 L 38 28 L 62 28 L 86 14 L 86 42 L 86 76 C 86 84 80 88 72 88 L 28 88 C 20 88 14 84 14 76 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" />

  <!-- 深石板蓝灰猫耳终端主体 -->
  <path d="M 14 42 L 14 14 L 38 28 L 62 28 L 86 14 L 86 42 L 86 76 C 86 84 80 88 72 88 L 28 88 C 20 88 14 84 14 76 Z" fill="#2D3748" stroke="#000000" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />

  <!-- 耳廓内侧微调装饰线 -->
  <path d="M 21 34 L 21 23 L 31 29" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 79 34 L 79 23 L 69 29" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 终端提示符 '>' -->
  <path d="M 28 47 L 44 58 L 28 69" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 终端下划线光标 '_'；为保持浏览器兼容性，暂不启用闪烁动画 -->
  <line x1="52" y1="69" x2="72" y2="69" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
    <!--
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite" />
    -->
  </line>
</svg>